<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Weapon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Exo+2:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="intro-overlay" id="introOverlay">
      <div class="intro-panel">
        <div class="settings-row">
          <button class="sound-toggle" id="fxToggle" type="button" aria-pressed="true">
            <span class="sound-toggle-label">Sound</span>
            <span class="sound-toggle-switch"></span>
          </button>
          <button class="sound-toggle" id="musicToggle" type="button" aria-pressed="true">
            <span class="sound-toggle-label">Music</span>
            <span class="sound-toggle-switch"></span>
          </button>
        </div>
        <button class="intro-enter" id="introEnter" type="button">Enter</button>
      </div>
    </div>

    <div class="floating-toggles">
      <button class="floating-toggle" id="floatingFxToggle" type="button" aria-pressed="true" aria-label="Toggle sound effects">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <button class="floating-toggle" id="floatingMusicToggle" type="button" aria-pressed="true" aria-label="Toggle music">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="7" cy="17" r="2.5" stroke="currentColor" stroke-width="1.5" />
          <circle cx="16" cy="15" r="2.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M9.5 17V5.5L18.5 4v10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="scale-wrapper">
    <div class="screen">
      <header class="header">
        <h1 class="title">Select Weapon</h1>
        <div class="category-nav">
          <button class="nav-arrow" id="prevCategory" aria-label="Previous category">
            <svg width="8" height="14" viewBox="0 0 8 14"><path d="M8 0L0 7L8 14Z" /></svg>
          </button>
          <div class="pad-badge-group">
            <button class="pad-badge-btn" id="lbButton" type="button" aria-label="Previous category">
              <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-label="LB">
                <path
                  d="M 59.63 20.19 Q 60 16.25 56.25 14.75 Q 35 6.25 18 21.13 Q 15 23.75 15.56 26.56 L 17.63 36.88 Q 18.75 42.5 30.38 42.5 L 45.88 42.5 Q 57.5 42.5 58.25 34.63 L 59.63 20.19 Z"
                />
                <text x="37.5" y="30">LB</text>
              </svg>
            </button>
            <button class="pad-badge-btn" id="rbButton" type="button" aria-label="Next category">
              <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-label="RB">
                <path
                  d="M 15.37 20.19 Q 15 16.25 18.75 14.75 Q 40 6.25 57 21.13 Q 60 23.75 59.44 26.56 L 57.37 36.88 Q 56.25 42.5 44.62 42.5 L 29.12 42.5 Q 17.5 42.5 16.75 34.63 L 15.37 20.19 Z"
                />
                <text x="37.5" y="30">RB</text>
              </svg>
            </button>
          </div>
          <button class="nav-arrow" id="nextCategory" aria-label="Next category">
            <svg width="8" height="14" viewBox="0 0 8 14"><path d="M0 0L8 7L0 14Z" /></svg>
          </button>
        </div>
      </header>

      <div class="viewport" id="mainViewport"></div>

      <div class="info-row" id="infoRow"></div>

      <nav class="category-tabs" id="categoryTabs"></nav>

      <div class="carousel" id="carousel"></div>

      <footer class="footer-prompts">
        <button class="prompt select" type="button" aria-label="Select">
          <span class="prompt-icon">X</span>
          <span class="prompt-label">Select</span>
        </button>
        <button class="prompt back" type="button" aria-label="Back">
          <span class="prompt-icon">B</span>
          <span class="prompt-label">Back</span>
        </button>
      </footer>
    </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
