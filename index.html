<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Weapon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Exo+2:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="screen">
      <header class="header">
        <h1 class="title">Select Weapon</h1>
        <div class="category-nav">
          <button class="nav-arrow" id="prevCategory" aria-label="Previous category">
            <svg width="8" height="14" viewBox="0 0 8 14"><path d="M8 0L0 7L8 14Z" /></svg>
          </button>
          <div class="pad-badge-group">
            <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-label="LB">
              <path
                d="M 59.63 20.19 Q 60 16.25 56.25 14.75 Q 35 6.25 18 21.13 Q 15 23.75 15.56 26.56 L 17.63 36.88 Q 18.75 42.5 30.38 42.5 L 45.88 42.5 Q 57.5 42.5 58.25 34.63 L 59.63 20.19 Z"
              />
              <text x="37.5" y="30">LB</text>
            </svg>
            <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-label="RB">
              <path
                d="M 15.37 20.19 Q 15 16.25 18.75 14.75 Q 40 6.25 57 21.13 Q 60 23.75 59.44 26.56 L 57.37 36.88 Q 56.25 42.5 44.62 42.5 L 29.12 42.5 Q 17.5 42.5 16.75 34.63 L 15.37 20.19 Z"
              />
              <text x="37.5" y="30">RB</text>
            </svg>
          </div>
          <button class="nav-arrow" id="nextCategory" aria-label="Next category">
            <svg width="8" height="14" viewBox="0 0 8 14"><path d="M0 0L8 7L0 14Z" /></svg>
          </button>
        </div>
      </header>

      <div class="viewport" id="mainViewport"></div>

      <div class="info-row" id="infoRow"></div>

      <nav class="category-tabs" id="categoryTabs"></nav>

      <div class="carousel" id="carousel"></div>

      <footer class="footer-prompts">
        <div class="prompt">
          <span class="prompt-icon select">X</span>
          <span class="prompt-label">Select</span>
        </div>
        <div class="prompt">
          <span class="prompt-icon back">B</span>
          <span class="prompt-label">Back</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
