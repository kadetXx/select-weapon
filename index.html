<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A 3D FPS weapon select HUD, built with Three.js." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>Select Weapon</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Select Weapon" />
    <meta property="og:description" content="A 3D FPS weapon select HUD, built with Three.js." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Select Weapon" />
    <meta name="twitter:description" content="A 3D FPS weapon select HUD, built with Three.js." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="fontsStylesheet"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Exo+2:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Exo+2:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
      />
    </noscript>
    <!-- the default category's model: shared by the main viewport and all
         4 carousel cards via the model cache, so it's the one fetch that
         actually gates first paint -- starting it during HTML parsing beats
         waiting for the JS bundle to load and request it itself -->
    <link rel="preload" href="/models/smg.glb" as="fetch" crossorigin />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="intro-overlay" id="introOverlay">
      <div class="intro-panel">
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
          <span class="sound-toggle-label">Sound</span>
          <span class="sound-toggle-switch"></span>
        </button>
        <button class="intro-enter" id="introEnter" type="button">Enter</button>
      </div>
    </div>

    <div class="scale-wrapper">
    <div class="screen">
      <header class="header">
        <h1 class="title">Select Weapon</h1>
        <div class="category-nav">
          <button class="nav-arrow" id="prevCategory" aria-label="Previous category">
            <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M8 0L0 7L8 14Z" /></svg>
          </button>
          <div class="pad-badge-group">
            <button class="pad-badge-btn" id="lbButton" type="button" aria-label="Previous category">
              <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-hidden="true">
                <path
                  d="M 59.63 20.19 Q 60 16.25 56.25 14.75 Q 35 6.25 18 21.13 Q 15 23.75 15.56 26.56 L 17.63 36.88 Q 18.75 42.5 30.38 42.5 L 45.88 42.5 Q 57.5 42.5 58.25 34.63 L 59.63 20.19 Z"
                />
                <text x="37.5" y="30">LB</text>
              </svg>
            </button>
            <button class="pad-badge-btn" id="rbButton" type="button" aria-label="Next category">
              <svg class="pad-badge" width="60" height="40" viewBox="0 0 75 50" aria-hidden="true">
                <path
                  d="M 15.37 20.19 Q 15 16.25 18.75 14.75 Q 40 6.25 57 21.13 Q 60 23.75 59.44 26.56 L 57.37 36.88 Q 56.25 42.5 44.62 42.5 L 29.12 42.5 Q 17.5 42.5 16.75 34.63 L 15.37 20.19 Z"
                />
                <text x="37.5" y="30">RB</text>
              </svg>
            </button>
          </div>
          <button class="nav-arrow" id="nextCategory" aria-label="Next category">
            <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M0 0L8 7L0 14Z" /></svg>
          </button>
        </div>
      </header>

      <div class="viewport" id="mainViewport"></div>

      <div class="info-row" id="infoRow"></div>

      <nav class="category-tabs" id="categoryTabs" aria-label="Weapon categories"></nav>

      <div class="carousel" id="carousel" role="group" aria-label="Weapon slots"></div>

      <footer class="footer-prompts">
        <button class="prompt select" type="button" aria-label="Select">
          <span class="prompt-icon">X</span>
          <span class="prompt-label">Select</span>
        </button>
        <button class="prompt back" type="button" aria-label="Back">
          <span class="prompt-icon">B</span>
          <span class="prompt-label">Back</span>
        </button>
      </footer>
    </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
